<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clipA">
      <rect width="1200" height="280" rx="24"/>
    </clipPath>

    <clipPath id="rightClipA">
      <rect x="700" y="0" width="500" height="280"/>
    </clipPath>

    <pattern id="gridA" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#2B3138" stroke-width="1" opacity="0.26"/>
    </pattern>

    <pattern id="dotsA" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#7E91A6" opacity="0.12"/>
    </pattern>
  </defs>

  <g clip-path="url(#clipA)">
    <!-- base -->
    <rect width="1200" height="280" rx="24" fill="#0D1117"/>
    <rect width="1200" height="280" fill="url(#gridA)"/>

    <!-- right-side field -->
    <path d="M790 0H1200V280H700L790 0Z" fill="#0A0F14" opacity="0.92"/>
    <rect x="785" y="38" width="300" height="176" fill="url(#dotsA)" opacity="0.55"/>

    <!-- right-side artwork only -->
    <g clip-path="url(#rightClipA)">
      <!-- primary sweep -->
      <path
        d="M650 205C735 186 800 138 865 138C934 138 986 183 1043 179C1096 176 1141 152 1200 145"
        stroke="#6F849A"
        stroke-width="2"
        fill="none"
        opacity="0.58"/>

      <path
        d="M662 226C748 212 811 170 871 170C935 170 987 202 1044 198C1099 194 1145 177 1200 171"
        stroke="#8996A5"
        stroke-width="1.2"
        stroke-dasharray="5 8"
        fill="none"
        opacity="0.34"/>

      <!-- orbit motif -->
      <ellipse cx="953" cy="126" rx="150" ry="58" transform="rotate(-15 953 126)"
        stroke="#6F849A" stroke-width="1.5" opacity="0.42"/>
      <ellipse cx="953" cy="126" rx="188" ry="75" transform="rotate(-15 953 126)"
        stroke="#7E91A6" stroke-width="1.1" stroke-dasharray="7 8" opacity="0.24"/>
      <ellipse cx="953" cy="126" rx="108" ry="40" transform="rotate(-15 953 126)"
        stroke="#8B949E" stroke-width="1" opacity="0.18"/>

      <circle cx="957" cy="126" r="45" fill="#161B22" stroke="#6F849A" stroke-width="1.7"/>
      <circle cx="957" cy="126" r="5" fill="#C9D1D9"/>
      <circle cx="994" cy="98" r="3.5" fill="#6F849A"/>
      <circle cx="1079" cy="82" r="4.5" fill="#E6EDF3"/>
      <circle cx="1041" cy="151" r="10" fill="#0D1117" stroke="#8B949E" stroke-width="1"/>

      <!-- quiet network -->
      <g stroke="#6F849A" stroke-width="1.1" opacity="0.36">
        <path d="M730 188L760 162L796 188L836 166L874 192"/>
        <path d="M760 162L815 142L836 166"/>
      </g>
      <g fill="#A3B0BE" opacity="0.66">
        <circle cx="730" cy="188" r="3.2"/>
        <circle cx="760" cy="162" r="3.2"/>
        <circle cx="796" cy="188" r="3.2"/>
        <circle cx="815" cy="142" r="3.2"/>
        <circle cx="836" cy="166" r="3.2"/>
        <circle cx="874" cy="192" r="3.2"/>
      </g>
    </g>

    <!-- text block -->
    <rect x="58" y="54" width="598" height="150" rx="18" fill="#0B0F14"/>
    <rect x="58" y="54" width="598" height="150" rx="18" stroke="#2B3138"/>

    <!-- text -->
    <text x="80" y="118"
