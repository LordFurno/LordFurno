    <text x="82" y="189"
      fill="#8B949E"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="18"
      font-weight="500">
      exoplanet atmospheres / reinforcement learning / simulations
    </text>

    <!-- frame -->
    <rect x="1.5" y="1.5" width="1197" height="277" rx="22.5" stroke="#30363D" stroke-width="3"/>
